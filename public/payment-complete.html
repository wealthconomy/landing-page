<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Returning to Wealthconomy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f7;
      color: #1a2e2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(21, 93, 95, 0.08);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: #e8f5f3;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-container svg {
      width: 44px;
      height: 44px;
      color: #155d5f;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #155d5f;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #556969;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #155d5f;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.2s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover, .btn:active {
      background: #0f4648;
    }
    .subtext {
      margin-top: 20px;
      font-size: 13px;
      color: #8fa0a0;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Taking you back to Wealthconomy</h1>
    <p>Your payment has been submitted. Your wallet updates as soon as it is confirmed.</p>
    <a id="return-btn" href="wealthconomy://payment/return" class="btn">Return to App</a>
    <p class="subtext">If the app didn't open automatically, tap the button above.</p>
  </div>

  <script>
    (function() {
      // Attempt to automatically return to the Wealthconomy mobile app
      var deepLink = "wealthconomy://payment/return";
      setTimeout(function() {
        try {
          window.location.href = deepLink;
        } catch (e) {
          console.warn("Could not auto-redirect:", e);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
